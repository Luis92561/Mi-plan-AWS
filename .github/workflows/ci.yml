name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Vitest
        run: npm test
      - name: Build de producción
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Escenarios end-to-end
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright (escenarios §11.2, exportaciones y capturas)
        run: npx playwright test --grep-invert pwa
      - name: Capturas del entregable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-shots
          path: docs/shots
          retention-days: 7
      - name: Trazas y errores
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: test-results
          retention-days: 7

  pwa:
    name: Offline real (PWA)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Servir el build
        run: npx vite preview --port 5184 --strictPort --host 127.0.0.1 &
      - run: npx playwright install --with-deps chromium
      - name: Playwright contra el build (service worker)
        env:
          PWA_URL: http://127.0.0.1:5184
        run: npx playwright test tests/e2e/pwa-offline.spec.ts --project=chromium
